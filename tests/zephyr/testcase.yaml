common:
  tags: microhal zephyr renode
  timeout: 120
  min_ram: 32
  min_flash: 128

tests:
  microhal.ztest.renode_stm32f4_disco:
    platform_allow:
      - stm32f4_disco
    integration_platforms:
      - stm32f4_disco
    extra_configs:
      - CONFIG_GPIO=y
      - CONFIG_SERIAL=y
      - CONFIG_UART_CONSOLE=y

  microhal.ztest.renode_frdm_k64f:
    platform_allow:
      - frdm_k64f
    integration_platforms:
      - frdm_k64f
    extra_configs:
      - CONFIG_GPIO=y
      - CONFIG_SERIAL=y
      - CONFIG_UART_CONSOLE=y
